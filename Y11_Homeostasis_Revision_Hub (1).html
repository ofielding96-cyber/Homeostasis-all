const SYL={homeostasis:'ho·me·o·sta·sis',stimulus:'stim·u·lus',receptor:'re·cep·tor',effector:'ef·fec·tor',neurone:'neu·rone',synapse:'syn·apse',neurotransmitter:'neu·ro·trans·mit·ter',coordination:'co·or·di·na·tion',
'cerebral cortex':'ce·re·bral cor·tex',cerebellum:'ce·re·bel·lum',medulla:'me·dul·la',accommodation:'ac·com·mo·da·tion',suspensory:'sus·pen·so·ry',ciliary:'cil·i·ar·y',myopia:'my·o·pi·a',hyperopia:'hy·per·o·pi·a',refraction:'re·frac·tion',
endocrine:'en·do·crine',pituitary:'pi·tu·i·tar·y',pancreas:'pan·cre·as',glycogen:'gly·co·gen',glucagon:'glu·ca·gon',insulin:'in·su·lin',hormone:'hor·mone',oestrogen:'oes·tro·gen',progesterone:'pro·ges·ter·one',ovulation:'ov·u·la·tion',
thyroxine:'thy·rox·ine',adrenaline:'a·dren·a·line',vasodilation:'vas·o·di·la·tion',vasoconstriction:'vas·o·con·stric·tion',thermoregulatory:'ther·mo·reg·u·la·to·ry',evaporation:'e·vap·o·ra·tion',reabsorption:'re·ab·sorp·tion',filtration:'fil·tra·tion',
dialysis:'di·al·y·sis',phototropism:'pho·to·tro·pism',gravitropism:'grav·i·tro·pism',auxin:'aux·in',gibberellins:'gib·ber·el·lins',ethene:'eth·ene',tropism:'tro·pism',urea:'u·re·a',excretion:'ex·cre·tion',contraception:'con·tra·cep·tion',
testosterone:'tes·tos·ter·one',metabolic:'met·a·bol·ic',dormancy:'dor·man·cy',elongation:'e·lon·ga·tion',permeable:'per·me·a·ble',reflex:'re·flex',axon:'ax·on',dendrite:'den·drite',diabetes:'di·a·be·tes',thermoregulation:'ther·mo·reg·u·la·tion'};
function fmt(s){return s.replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g,(m,k,d)=>{const y=SYL[k.toLowerCase()];return '<b class="t"'+(y?' data-syl="'+y+'"':'')+'>'+(d||k)+'</b>'})}
const HT=h=>'<div class="htblock"><span class="tier ht">Higher tier</span> '+h+'</div>';
const BO=h=>'<div class="boblock"><span class="tier bo">Biology only</span> '+h+'</div>';
const MODS=[
{id:1,icon:'⚡',t:'Homeostasis and the nervous system',spec:'AQA 4.5.1, 4.5.2.1 and Required Practical 7',tag:'',
intro:'How the body keeps internal conditions stable, and how nerves carry fast electrical messages.',
notes:[
{h:'What is homeostasis?',html:`<p>{{Homeostasis}} is the regulation of the internal conditions of a cell or organism to maintain optimum conditions for function, in response to internal and external changes.</p>
<p>It keeps <b>blood glucose concentration</b>, <b>body temperature</b> and <b>water levels</b> within narrow limits. Enzymes and cells only work well in the right conditions.</p>
<p>Every automatic control system has three parts:</p>
<ul><li>{{Receptors}} detect a change (a {{stimulus}}).</li><li>A <b>coordination centre</b> (brain, spinal cord or pancreas) receives and processes the information, then sends out signals.</li><li>{{Effectors}} (muscles or glands) bring about a response that restores the optimum condition.</li></ul>`},
{h:'Nervous versus hormonal coordination',html:`<div class="tbl"><table class="dt"><tr><th></th><th>Nervous system</th><th>Hormonal (endocrine) system</th></tr>
<tr><td>Message</td><td>Electrical impulses</td><td>Chemical {{hormones}} carried in the blood</td></tr><tr><td>Speed</td><td>Very fast</td><td>Slower</td></tr>
<tr><td>Duration of effect</td><td>Short</td><td>Longer lasting</td></tr><tr><td>Target</td><td>Very precise (specific muscle or gland)</td><td>Often wide-ranging, acts on target organs</td></tr></table></div>`},
{h:'Neurones, synapses and reflexes',html:`<p>The central nervous system (CNS) is the <b>brain and spinal cord</b>. Three types of {{neurone}} carry impulses: <b>sensory</b> (receptor → CNS), <b>relay</b> (inside the CNS) and <b>motor</b> (CNS → effector).</p>
<p>A neurone has {{dendrites}}, a cell body, an {{axon}} (often covered in a fatty myelin sheath that speeds up impulses) and axon terminals.</p>
<p>Neurones do not touch. At a {{synapse}} the electrical impulse triggers the release of a chemical ({{neurotransmitter}}). It <b>diffuses across the gap</b> and binds to receptor molecules on the next neurone, starting a new electrical impulse.</p>
<p>A {{reflex}} action is <b>automatic and rapid</b> and does not involve the conscious part of the brain. It protects the body.</p>
<p><b>Reflex arc:</b> stimulus → receptor → sensory neurone → relay neurone (in CNS) → motor neurone → effector → response.</p>`},
{h:'Required Practical 7: reaction time',html:`<p><b>Method:</b> a partner drops a ruler without warning; you catch it. Record the distance the ruler fell (cm), or convert to time using a table.</p>
<ul><li><b>Independent variable:</b> the factor you change (e.g. caffeine, distraction, hand used).</li><li><b>Dependent variable:</b> reaction time (or distance caught).</li><li><b>Control variables:</b> same ruler, same dropper, same starting position, same hand, same time of day.</li><li><b>Repeat</b> at least three times and calculate a <b>mean</b>. Identify and exclude any <b>anomalous</b> result before averaging.</li><li><b>Improvements:</b> more repeats and participants, computer-based timing, reduce practice effects, give no warning of the drop.</li></ul>`}],
terms:[['Homeostasis','Regulation of internal conditions to maintain optimum conditions for function.'],['Stimulus','A change in the environment that is detected by a receptor.'],['Receptor','Cell that detects a stimulus.'],['Coordination centre','Receives information from receptors and sends out instructions (brain, spinal cord, pancreas).'],['Effector','A muscle or gland that carries out the response.'],['Neurone','Nerve cell that carries electrical impulses.'],['Synapse','The gap between two neurones, crossed by a chemical.'],['Reflex action','Automatic, rapid response that does not involve the conscious brain.'],['Central nervous system','The brain and spinal cord.']],
explore:['neurone','reflex']},
{id:2,icon:'👁',t:'Brain and eye',spec:'AQA 4.5.2.2 and 4.5.2.3 (Biology only)',tag:'bo',
intro:'Structure and function of the brain and the eye, accommodation and common vision defects.',
notes:[
{h:'The brain',html:`<ul><li>{{Cerebral cortex}}: consciousness, intelligence, memory and language.</li><li>{{Cerebellum}}: coordinates muscular activity (movement and balance).</li><li>{{Medulla}}: controls unconscious activities such as heart rate and breathing.</li></ul>
<p><b>Investigating the brain:</b> scientists map functions by studying patients with brain damage, electrically stimulating parts of the brain and using MRI scans.</p>
<p><b>Why brain disorders are hard to investigate and treat:</b> the brain is very complex and delicate, difficult to access, and its regions work together, so surgery or drugs risk damaging other functions.</p>`},
{h:'Structure of the eye',html:`<div class="tbl"><table class="dt"><tr><th>Structure</th><th>Function</th></tr><tr><td>Cornea</td><td>Refracts (bends) light into the eye</td></tr><tr><td>Iris</td><td>Controls how much light enters by changing pupil size</td></tr><tr><td>Lens</td><td>Focuses light onto the retina</td></tr><tr><td>Retina</td><td>Contains light receptor cells</td></tr><tr><td>Optic nerve</td><td>Carries impulses from the retina to the brain</td></tr><tr><td>Ciliary muscles and suspensory ligaments</td><td>Change the shape of the lens</td></tr></table></div>`},
{h:'Accommodation',html:`<p>{{Accommodation}} is changing the shape of the lens to focus on near or distant objects.</p>
<div class="tbl"><table class="dt"><tr><th></th><th>Near object</th><th>Distant object</th></tr><tr><td>Ciliary muscles</td><td>Contract</td><td>Relax</td></tr><tr><td>Suspensory ligaments</td><td>Loosen</td><td>Pulled tight</td></tr><tr><td>Lens</td><td>Thicker (more curved), refracts light more</td><td>Thinner, refracts light less</td></tr></table></div>
<p class="note">Common mistake: the muscles do not "stretch" the lens for near objects. Contraction of the ring of ciliary muscle slackens the ligaments so the lens springs thicker.</p>`},
{h:'Vision defects and treatments',html:`<ul><li>{{Myopia}} (short-sightedness): distant objects look blurred. Light from distant objects focuses <b>in front of</b> the retina (eyeball too long or lens too strong). Corrected with a <b>concave</b> lens.</li><li>{{Hyperopia}} (long-sightedness): near objects look blurred. Light from near objects focuses <b>behind</b> the retina (eyeball too short or lens too weak). Corrected with a <b>convex</b> lens.</li></ul>
<p><b>Treatments:</b> glasses, hard or soft contact lenses, laser eye surgery (reshapes the cornea) and replacement lenses. Each has benefits and risks, such as cost, convenience, infection and permanence.</p>`}],
terms:[['Cerebral cortex','Brain region for consciousness, intelligence, memory and language.'],['Cerebellum','Brain region that coordinates muscular activity.'],['Medulla','Brain region that controls heart rate and breathing.'],['Cornea','Transparent front of the eye that refracts light.'],['Iris','Muscle that controls pupil size.'],['Retina','Layer containing light receptor cells.'],['Ciliary muscle','Muscle that changes the shape of the lens.'],['Suspensory ligaments','Fibres that connect the lens to the ciliary muscle.'],['Accommodation','Changing lens shape to focus on near or distant objects.'],['Myopia','Short-sightedness: light focuses in front of the retina.'],['Hyperopia','Long-sightedness: light focuses behind the retina.']],

{id:3,icon:'🧪',t:'Hormones and blood glucose',spec:'AQA 4.5.3.1 and 4.5.3.2',tag:'',
intro:'The endocrine system, and how insulin and glucagon keep blood glucose steady.',
notes:[
{h:'The endocrine system',html:`<p>{{Endocrine}} glands secrete {{hormones}} directly into the blood. The blood carries hormones to <b>target organs</b>, where they act.</p>
<div class="tbl"><table class="dt"><tr><th>Gland</th><th>Hormone(s) mentioned in AQA GCSE</th></tr><tr><td>{{Pituitary}} gland</td><td>Master gland; makes hormones that act on other glands (e.g. FSH, LH; ADH in Biology only)</td></tr><tr><td>Thyroid</td><td>Thyroxine</td></tr><tr><td>{{Pancreas}}</td><td>Insulin (and glucagon)</td></tr><tr><td>Adrenal glands</td><td>Adrenaline</td></tr><tr><td>Ovaries</td><td>Oestrogen, progesterone</td></tr><tr><td>Testes</td><td>Testosterone</td></tr></table></div>`},
{h:'Controlling blood glucose',html:`<p>The pancreas monitors blood glucose. If it is <b>too high</b>, the pancreas releases {{insulin}}. Insulin makes glucose move from the blood into cells. In the liver and muscles, excess glucose is converted to {{glycogen}} for storage.</p>
${HT(`<p>If blood glucose is <b>too low</b>, the pancreas releases {{glucagon}}. Glucagon makes glycogen in the liver convert back into glucose, which is released into the blood.</p><p><b>Negative feedback:</b> a change is detected, and the response reverses it, keeping the level close to normal. Insulin and glucagon work in opposite directions.</p>`)}
<p class="note">Responses are not instant: hormones take time to be released, travel in the blood and act, so levels rise and fall gradually.</p>`},
{h:'Diabetes',html:`<div class="tbl"><table class="dt"><tr><th></th><th>Type 1</th><th>Type 2</th></tr><tr><td>Cause</td><td>Pancreas produces little or no insulin</td><td>Body cells no longer respond properly to insulin</td></tr><tr><td>Risk factor</td><td>Not caused by lifestyle</td><td>Obesity is a risk factor</td></tr><tr><td>Treatment</td><td>Insulin injections, monitoring carbohydrate intake and exercise</td><td>Carbohydrate-controlled diet, increased exercise, weight loss (medication may also be used)</td></tr></table></div>
<p>Without control, blood glucose can rise to dangerously high levels. Glucose may appear in the urine.</p>`}],
terms:[['Hormone','Chemical messenger secreted by a gland and carried in the blood.'],['Endocrine gland','Gland that secretes hormones directly into the blood.'],['Target organ','Organ that responds to a particular hormone.'],['Pancreas','Gland that monitors blood glucose and releases insulin and glucagon.'],['Insulin','Hormone that lowers blood glucose by moving glucose into cells.'],['Glucagon (HT)','Hormone that raises blood glucose by converting glycogen to glucose.'],['Glycogen','Storage carbohydrate in the liver and muscles.'],['Negative feedback (HT)','A change triggers a response that reverses the change.'],['Type 1 diabetes','Pancreas makes little or no insulin.'],['Type 2 diabetes','Body cells no longer respond to insulin.']],

{id:4,icon:'🔄',t:'Reproductive hormones and fertility',spec:'AQA 4.5.3.4, 4.5.3.5 and 4.5.3.6',tag:'',
intro:'Hormones that control the menstrual cycle, contraception and fertility treatment.',
notes:[
{h:'Hormones at puberty',html:`<p>{{Testosterone}} is produced by the testes and stimulates sperm production. {{Oestrogen}} is the main female reproductive hormone, produced in the ovaries. At puberty, eggs begin to mature and one is released about every 28 days ({{ovulation}}).</p>`},
{h:'The menstrual cycle (about 28 days)',html:`<ul><li><b>Days 1–5:</b> the uterus lining breaks down (menstruation).</li><li><b>Days 5–14:</b> the lining repairs and thickens.</li><li><b>Day 14:</b> ovulation (egg released).</li><li><b>Days 14–28:</b> the lining is maintained.</li></ul>
<div class="tbl"><table class="dt"><tr><th>Hormone</th><th>Made by</th><th>Role</th></tr><tr><td>FSH</td><td>Pituitary gland</td><td>Causes an egg to mature in the ovary; stimulates oestrogen release</td></tr><tr><td>LH</td><td>Pituitary gland</td><td>Stimulates release of the egg (ovulation)</td></tr><tr><td>Oestrogen</td><td>Ovaries</td><td>Causes the uterus lining to thicken and grow</td></tr><tr><td>{{Progesterone}}</td><td>Ovaries</td><td>Maintains the uterus lining</td></tr></table></div>
${HT(`<p><b>Interactions:</b> FSH stimulates the ovary to release oestrogen. Oestrogen inhibits FSH and, when high, stimulates the pituitary to release an LH surge. Progesterone inhibits both FSH and LH.</p>`)}`},
{h:'Contraception',html:`<p>{{Contraception}} reduces the chance of pregnancy. Use the comparison tool below to explore methods.</p><div id="w-contra"></div>`},
{h:'Fertility treatment',html:`${HT(`<p>Hormones can treat infertility. <b>FSH and LH</b> can be given to stimulate egg maturation and ovulation.</p><p><b>IVF (in vitro fertilisation):</b> (1) FSH and LH are given to stimulate eggs to mature; (2) eggs are collected from the mother and fertilised in the laboratory with sperm; (3) the fertilised eggs develop into embryos; (4) one or two embryos are inserted into the mother's uterus.</p><p><b>Evaluation:</b> IVF gives a chance of pregnancy to couples who cannot conceive naturally. Limitations: emotionally and physically stressful, success rates are not high, a risk of multiple births, and cost. Ethical issues include what happens to unused embryos.</p>`)}`}],
terms:[['Oestrogen','Ovary hormone: thickens uterus lining.'],['Progesterone','Ovary hormone: maintains uterus lining.'],['FSH','Pituitary hormone: egg matures in ovary; stimulates oestrogen.'],['LH','Pituitary hormone: stimulates ovulation.'],['Ovulation','Release of a mature egg from the ovary.'],['Testosterone','Testes hormone: stimulates sperm production.'],['Contraception','Methods that reduce the chance of pregnancy.'],['IVF (HT)','In vitro fertilisation: eggs fertilised outside the body, embryos inserted into uterus.'],['Barrier method','Prevents sperm reaching the egg (e.g. condom).']],

{id:5,icon:'🌡',t:'Thermoregulation, adrenaline and thyroxine',spec:'AQA 4.5.2.4 (Biology only); adrenaline and thyroxine are Higher tier',tag:'bo',
intro:'How the body controls its temperature, plus the roles of adrenaline and thyroxine.',
notes:[
{h:'Controlling body temperature',html:`<p>Body temperature is kept at about <b>37 °C</b>, the optimum for enzymes. The {{thermoregulatory}} centre in the brain contains receptors sensitive to the temperature of the blood. The skin has temperature receptors that send impulses to the centre. The centre then sends impulses to effectors.</p>
<div class="tbl"><table class="dt"><tr><th>Too hot</th><th>Too cold</th></tr><tr><td>Sweat glands release sweat. {{Evaporation}} of sweat transfers energy from the skin to the environment.</td><td>Muscles contract rapidly (shivering). Respiration in the muscles releases energy that warms the body.</td></tr><tr><td>{{Vasodilation}}: blood vessels supplying skin capillaries widen, so more blood flows near the surface and more energy is radiated.</td><td>{{Vasoconstriction}}: blood vessels narrow, so less blood flows near the surface and less energy is lost. Sweating stops.</td></tr></table></div>
<p class="note">Common mistake: blood vessels do not move towards or away from the skin. They get wider or narrower.</p>`},
{h:'Adrenaline and thyroxine',html:`${HT(`<p>{{Adrenaline}} is released by the <b>adrenal glands</b> (above the kidneys) in times of fear or stress. It increases heart rate and boosts delivery of oxygen and glucose to the brain and muscles, preparing the body for "fight or flight".</p>
<p>{{Thyroxine}} is released by the <b>thyroid gland</b>. It stimulates the basal {{metabolic}} rate and is important for growth and development. Thyroxine levels are controlled by <b>negative feedback</b>: if the level is too low, the thyroid is stimulated to release more; if too high, stimulation is reduced.</p>`)}`}],
terms:[['Thermoregulatory centre','Part of the brain that monitors and controls body temperature.'],['Vasodilation','Widening of skin blood vessels so more heat is lost.'],['Vasoconstriction','Narrowing of skin blood vessels so less heat is lost.'],['Evaporation','Sweat changing to vapour, transferring energy from skin to environment.'],['Shivering','Rapid muscle contractions that release energy by respiration.'],['Adrenaline (HT)','Hormone from adrenal glands: fight or flight.'],['Thyroxine (HT)','Thyroid hormone that stimulates metabolic rate.'],['Metabolic rate (HT)','Rate of chemical reactions in the body.']],

{id:6,icon:'💧',t:'Kidneys, ADH and osmoregulation',spec:'AQA 4.5.3.3 (Biology only)',tag:'bo',
intro:'How the kidneys filter blood, balance water with ADH, and what happens when they fail.',
notes:[
{h:'Water and urea',html:`<p>Water is gained from food and drink and lost in sweat, breath and urine. {{Urea}} is made in the liver from the breakdown of excess amino acids and is removed by the kidneys ({{excretion}}).</p>`},
{h:'How the kidneys work',html:`<ol><li><b>{{Filtration}}:</b> blood is filtered under pressure. Small molecules (water, urea, ions, glucose) pass out. Large molecules (proteins) and blood cells stay in the blood.</li><li><b>Selective {{reabsorption}}:</b> all the glucose, and as much water and ions as the body needs, go back into the blood.</li><li>Urea, and excess water and ions, leave as <b>urine</b> to the bladder.</li></ol><p>A healthy person's urine contains no glucose or protein.</p>`},
{h:'ADH and negative feedback',html:`<p>The pituitary gland releases ADH into the blood. ADH increases the reabsorption of water in the kidneys.</p>
<ul><li>Blood too concentrated (low water): more ADH → more water reabsorbed → <b>small volume of concentrated urine</b>.</li><li>Blood too dilute (high water): less ADH → less water reabsorbed → <b>large volume of dilute urine</b>.</li></ul>
${HT(`<p>ADH makes the walls of the kidney tubules more permeable to water. This is <b>negative feedback</b>: when the water level changes, the response reverses it. Responses take time, so urine concentration changes gradually.</p>`)}`},
{h:'Kidney failure',html:`<p>If kidneys fail, water, ions and urea build up in the blood. Treatments:</p><ul><li><b>Dialysis:</b> blood flows next to a partially permeable membrane with dialysis fluid on the other side. Urea and excess ions diffuse out. The fluid contains normal levels of glucose and ions so these are not lost. Sessions take hours, about three times a week.</li><li><b>Kidney transplant:</b> a healthy donor kidney needs a tissue match, the patient takes immunosuppressant drugs, and there is a risk of rejection. Donors are limited.</li></ul>`}],
terms:[['Urea','Waste product made in the liver from excess amino acids.'],['Excretion','Removal of waste products from the body.'],['Filtration','Small molecules forced out of the blood under pressure.'],['Selective reabsorption','Useful substances taken back into the blood.'],['ADH','Hormone from the pituitary gland that increases water reabsorption.'],['Dialysis','Treatment that removes waste from blood by diffusion across a membrane.'],['Transplant','Replacing a failed organ with a donor organ.'],['Dilute urine','Large volume of urine with a lot of water.'],['Concentrated urine','Small volume of urine with little water.']],

{id:7,icon:'🌱',t:'Plant hormones and tropisms',spec:'AQA 4.5.4 and Required Practical 8 (Biology only)',tag:'bo',
intro:'How plants respond to light and gravity using auxin, and how plant hormones are used commercially.',
notes:[
{h:'Tropisms',html:`<ul><li>{{Phototropism}}: response to light. Shoots grow <b>towards</b> light so leaves can photosynthesise.</li><li>{{Gravitropism}}: response to gravity. Shoots grow <b>away from</b> gravity; roots grow <b>towards</b> it, anchoring the plant and reaching water.</li></ul>
<p>Plant hormones such as {{auxin}} coordinate these responses. Auxin is made in the shoot tip.</p>`},
{h:'How auxin works',html:`${HT(`<p><b>Shoots:</b> auxin builds up on the shaded side (or lower side), stimulating cell {{elongation}} there, so that side grows faster and the shoot bends towards the light.</p><p><b>Roots:</b> auxin builds up on the lower side but <b>inhibits</b> growth there, so the upper side grows faster and the root bends downwards.</p>`)}`},
{h:'Required Practical 8',html:`<p>Investigate the effect of light or gravity on the growth of newly germinated seedlings.</p><ul><li><b>Independent:</b> direction of light (or orientation).</li><li><b>Dependent:</b> angle of bending or growth direction.</li><li><b>Control variables:</b> species, age, number of seedlings, temperature, water, light intensity, time.</li><li>Use a <b>control</b> (e.g. all-round light or darkness), repeat and calculate means, and spot anomalies.</li></ul>`},
{h:'Commercial uses of plant hormones',html:`${HT(`<ul><li><b>Auxins:</b> selective weedkillers, rooting powders for cuttings, and promoting growth in tissue culture.</li><li><b>{{Ethene}}:</b> controls ripening, so fruit can be picked unripe and ripened later.</li><li><b>{{Gibberellins}}:</b> end seed {{dormancy}}, promote flowering and increase fruit size.</li></ul>`)}`}],

{id:'m1-07',m:1,tp:'Reaction time data',ao:2,t:'num',mk:2,q:'A student catches a falling ruler five times. Trial 4 is anomalous. Calculate the mean distance without trial 4.',ctx:{tbl:{h:['Trial','1','2','3','4','5'],r:[['Distance caught (cm)','18','21','19','35','20']]}},a:19.5,tol:.05,u:'cm',e:'Exclude 35 cm. (18 + 21 + 19 + 20) ÷ 4 = 19.5 cm.',act:'Reaction-time data analysis'},
{id:'m1-08',m:1,tp:'Reaction time evaluation',ao:3,t:'mcq',q:'A student tests whether caffeine affects reaction time. Which conclusion is best supported by the data?',ctx:{tbl:{h:['Group (5 people)','Mean reaction time (s)','Range (s)'],r:[['No caffeine','0.24','0.21 – 0.28'],['Caffeine','0.21','0.19 – 0.26']]}},o:['Caffeine makes everyone react faster','The caffeine group had a lower mean, but the ranges overlap and the sample is small, so the evidence is limited','Caffeine has no effect because both means are below 0.3 s','Caffeine slows reaction time'],a:1,e:'A small difference in means with overlapping ranges and a small sample cannot prove an effect.',mis:'A difference in means alone is not proof of cause.',act:'Evaluate reaction-time evidence'},
{id:'m1-09',m:1,tp:'Variables',ao:2,t:'match',q:'Identify each item as the independent, dependent or control variable in a caffeine and reaction-time investigation.',p:[['Amount of caffeine given','Independent variable'],['Distance the ruler falls before it is caught','Dependent variable'],['Same ruler and same person dropping it','Control variable'],['Time of day of testing','Control variable']],e:'The independent variable is changed, the dependent variable is measured, and control variables are kept the same.',act:'Identify variables'},
{id:'m1-10',m:1,tp:'Improving investigations',ao:3,t:'written',mk:3,q:'A student tests the effect of caffeine on reaction time with the ruler-drop test. She uses five people, tests each person once and uses different dropping heights. Suggest three improvements.',ms:['Repeat the test several times for each person and calculate a mean','Use more participants (larger sample size)','Control variables, e.g. same dropper, same starting height, same time of day','Use a more precise method, e.g. a computer-based reaction timer','Test the same person with and without caffeine (and allow a rest period)'],need:3,model:'Repeat each test and take a mean; use more participants; keep the dropping height, dropper and time of day the same.',act:'Improve an investigation'},
{id:'m1-11',m:1,tp:'Nervous v hormonal',ao:1,t:'written',mk:2,q:'Give two differences between nervous and hormonal coordination.',ms:['Nervous uses electrical impulses; hormonal uses chemical hormones in the blood','Nervous responses are faster; hormonal are slower','Nervous effects are short-lived; hormonal effects last longer','Nervous responses are precise; hormonal act more widely on target organs'],need:2,model:'Nervous coordination uses electrical impulses and is fast with short-lived effects; hormones travel in the blood and act more slowly with longer-lasting effects.'},
/* ---------- MODULE 2 ---------- */
{id:'m2-01',m:2,tp:'Brain regions',ao:1,t:'label',q:'Label the three regions of the brain.',d:'brain',pt:['A','B','C'],lab:{A:'Cerebral cortex',B:'Cerebellum',C:'Medulla'},bank:['Cerebral cortex','Cerebellum','Medulla','Spinal cord','Pituitary gland'],e:'The cerebral cortex is the large folded outer layer, the cerebellum sits at the back and the medulla leads to the spinal cord.',act:'Label the brain'},
{id:'m2-02',m:2,tp:'Brain functions',ao:1,t:'match',q:'Match each brain region to its function.',p:[['Cerebral cortex','Memory and language'],['Cerebellum','Coordinates muscular activity and balance'],['Medulla','Controls heart rate and breathing']],x:['Produces insulin'],e:'Cortex: consciousness, intelligence, memory, language. Cerebellum: movement. Medulla: unconscious activities.'},
{id:'m2-03',m:2,tp:'Eye structure',ao:1,t:'label',q:'Label six structures of the eye.',d:'eye',pt:['A','B','C','D','F','G'],lab:{A:'Cornea',B:'Iris',C:'Lens',D:'Ciliary muscle',F:'Retina',G:'Optic nerve'},bank:['Cornea','Iris','Lens','Ciliary muscle','Retina','Optic nerve','Sclera','Suspensory ligaments'],e:'The cornea refracts light, the retina contains the receptors, and the optic nerve carries impulses to the brain.',act:'Label the eye'},
{id:'m2-04',m:2,tp:'Accommodation',ao:1,t:'order',mk:3,q:'Put the events in order when you focus on a near object.',it:['Ciliary muscles contract','Suspensory ligaments loosen','Lens becomes thicker','Light is refracted more','Light is focused on the retina'],e:'Contraction of the ciliary muscles loosens the suspensory ligaments, so the lens becomes thicker and refracts light more.',act:'Accommodation sequence'},
{id:'m2-05',m:2,tp:'Accommodation',ao:2,t:'mcq',q:'A person looks up from a book at a distant tree. Which describes the changes in the eye?',o:['Ciliary muscles relax, suspensory ligaments are pulled tight and the lens becomes thinner','Ciliary muscles contract, suspensory ligaments are pulled tight and the lens becomes thinner','Ciliary muscles relax, suspensory ligaments loosen and the lens becomes thicker','Ciliary muscles contract, suspensory ligaments loosen and the lens becomes thicker'],a:0,e:'For distant objects the ciliary muscles relax, the ligaments are pulled tight and the lens is thin.',mis:'Many pupils mix up contraction and relaxation. Near = contract = loose = thick.',act:'Accommodation simulation'},
{id:'m2-06',m:2,tp:'Vision defects',ao:2,t:'match',q:'Match each description to the correct vision defect or lens.',p:[['Light from distant objects focuses in front of the retina','Myopia'],['Light from near objects focuses behind the retina','Hyperopia'],['Type of lens that corrects short-sightedness','Concave lens'],['Type of lens that corrects long-sightedness','Convex lens']],e:'Myopia: focus in front, concave lens spreads rays. Hyperopia: focus behind, convex lens converges rays.',act:'Vision-defect challenge'},
{id:'m2-07',m:2,tp:'Pupil data',ao:2,t:'num',mk:2,q:'Calculate the percentage decrease in pupil diameter when light intensity increases from 10 to 80 arbitrary units. Give your answer to 1 decimal place.',ctx:{tbl:{h:['Light intensity (a.u.)','10','20','40','80'],r:[['Pupil diameter (mm)','7.0','5.5','4.0','3.0']]}},a:57.1,tol:.15,u:'%',e:'(7.0 − 3.0) ÷ 7.0 × 100 = 57.1%.'},
{id:'m2-08',m:2,tp:'Brain disorders',ao:2,t:'written',mk:2,q:'Explain why it is difficult to investigate and treat brain disorders.',ms:['The brain is very complex (many connected regions)','The brain is delicate and easily damaged by surgery','The brain is hard to access','Treating one region may affect other functions (risk of side effects)'],need:2,model:'The brain is complex and delicate, and damage to one region can affect other functions, so surgery or drugs are risky.'},
{id:'m2-09',m:2,tp:'Evaluating treatments',ao:3,t:'written',mk:4,q:'A 17-year-old with myopia is deciding between glasses and laser eye surgery. Evaluate the two options.',ms:['Glasses: non-invasive and cheap, and the prescription can be changed','Glasses can be lost or broken and may be inconvenient for sport','Laser surgery: reshapes the cornea, so may remove the need for glasses','Laser surgery carries risks (infection, dry eyes, damage) and is permanent','Laser surgery is more expensive','A reasoned judgement supported by the points above'],need:4,model:'Glasses are safe and cheap but inconvenient; laser surgery may remove the need for lenses but is permanent, costly and has risks. Judgement: glasses are sensible until the prescription is stable.',act:'Evaluate eye treatments'},
{id:'m2-10',m:2,tp:'Eye structure',ao:1,t:'mcq',q:'Which part of the eye contains the light receptor cells?',o:['Retina','Cornea','Iris','Optic nerve'],a:0,e:'The retina contains the receptors. The optic nerve carries impulses to the brain.'},
{id:'m2-11',m:2,tp:'Eye diagrams',ao:2,t:'mcq',q:'The diagram shows light from a distant object entering a person’s eye. Which vision defect does the person have and which lens would correct it?',ctx:{eye:{u:6,cond:'myopia',corr:'none'}},o:['Myopia; concave lens','Myopia; convex lens','Hyperopia; concave lens','Hyperopia; convex lens'],a:0,e:'The light focuses in front of the retina, which is myopia. A concave lens spreads the rays so they focus further back.',act:'Identify defects from diagrams'},
{id:'m2-12',m:2,tp:'Evaluating treatments',ao:3,t:'mcq',q:'A 15-year-old’s myopia is still getting worse each year. Which is the best evaluation of laser eye surgery for them?',o:['Glasses may be more suitable for now because surgery is permanent and the eye shape may still change','Laser surgery is always the best option for every patient','Contact lenses carry no risks so surgery is unnecessary','Glasses cannot correct myopia'],a:0,e:'Surgery changes the cornea permanently. If the eye is still changing, the result may not last.'},
/* ---------- MODULE 3 ---------- */
{id:'m3-01',m:3,tp:'Endocrine glands',ao:1,t:'match',q:'Match each gland to the hormone it releases.',p:[['Pancreas','Insulin'],['Thyroid gland','Thyroxine'],['Adrenal gland','Adrenaline'],['Ovary','Oestrogen'],['Testis','Testosterone']],e:'Hormones are made by endocrine glands and carried in the blood.',act:'Match glands to hormones'},
{id:'m3-02',m:3,tp:'Endocrine glands',ao:1,t:'label',q:'Label the endocrine glands (ovary is shown on the female side, testis on the male side).',d:'glands',pt:['A','B','C','D','E','F'],lab:{A:'Pituitary gland',B:'Thyroid gland',C:'Adrenal gland',D:'Pancreas',E:'Ovary',F:'Testis'},bank:['Pituitary gland','Thyroid gland','Adrenal gland','Pancreas','Ovary','Testis','Liver'],e:'The pituitary is in the head, the thyroid in the neck, adrenals above the kidneys and the pancreas in the abdomen.',act:'Label the glands'},
{id:'m3-03',m:3,tp:'Blood glucose',ao:1,t:'mcq',q:'Which organ monitors blood glucose concentration and releases insulin?',o:['Pancreas','Pituitary gland','Kidney','Thyroid gland'],a:0,e:'The pancreas monitors blood glucose and releases insulin (and glucagon).'},
{id:'m3-04',m:3,tp:'Insulin response',ao:1,t:'order',mk:3,q:'Order the events after a high-carbohydrate meal.',it:['Blood glucose concentration rises','Pancreas releases insulin','Glucose moves into cells and excess is stored as glycogen','Blood glucose concentration falls back to normal'],e:'Insulin causes glucose to move into cells and be converted to glycogen in the liver and muscles.',act:'Insulin sequence'},
{id:'m3-05',m:3,tp:'Glucagon response',ao:1,ht:1,t:'order',mk:3,q:'Order the events when blood glucose falls below normal.',it:['Blood glucose concentration falls below normal','Pancreas releases glucagon','Liver converts glycogen into glucose','Glucose is released into the blood','Blood glucose concentration rises back to normal'],e:'Glucagon causes glycogen to be converted to glucose, which is released into the blood.',act:'Glucagon sequence'},
{id:'m3-06',m:3,tp:'Diabetes',ao:2,t:'mcq',q:'A person with obesity has high blood glucose even though their pancreas releases plenty of insulin. What is the most likely condition?',o:['Type 2 diabetes, because body cells no longer respond properly to insulin','Type 1 diabetes, because the pancreas cannot make insulin','Type 1 diabetes, because cells do not respond to insulin','Glucagon deficiency, because glucose cannot be stored'],a:0,e:'In Type 2 diabetes the body cells no longer respond to insulin. Obesity is a risk factor.',mis:'Type 1 is a lack of insulin; Type 2 is a poor response to insulin.'},
{id:'m3-07',m:3,tp:'Diabetes',ao:2,t:'mcq',q:'A person with untreated Type 1 diabetes eats a large pasta meal. Predict what happens to their blood glucose.',o:['It rises to a high level because there is no insulin to move glucose into cells','It falls because insulin is released','It stays constant because glucagon is released','It falls because the liver stores glucose'],a:0,e:'Without insulin, glucose is not taken up by cells or stored as glycogen, so it stays high.'},
{id:'m3-08',m:3,tp:'Glucose graphs',ao:3,t:'num',mk:1,q:'Person B has diabetes. Calculate how much higher the peak blood glucose concentration of person B was than that of person A.',ctx:{chart:CH_GLU},a:4,tol:.05,u:'mmol/dm³',e:'Peak B = 11.0, peak A = 7.0. 11.0 − 7.0 = 4.0 mmol/dm³.',act:'Interpret glucose graphs'},
{id:'m3-09',m:3,tp:'Glucose graphs',ao:3,t:'mcq',q:'Which conclusion is supported by the graph?',ctx:{chart:CH_GLU},o:['Person B’s glucose peaked later and had not returned to its starting value after 180 minutes','Person A has diabetes','Person B’s glucose fell faster than person A’s','Both people returned to their starting values at the same time'],a:0,e:'B peaks at 60 minutes and is still 7.5 at 180 minutes (starting value 6.0). A returns to 5.0 by 120–150 minutes.',act:'Interpret glucose graphs'},
{id:'m3-10',m:3,tp:'Negative feedback',ao:2,ht:1,t:'written',mk:3,q:'Explain how negative feedback returns blood glucose concentration to normal after a long period of exercise.',ms:['Blood glucose falls below normal and is detected by the pancreas','The pancreas releases glucagon','Glucagon causes glycogen (in the liver) to be converted into glucose','Glucose is released into the blood so concentration rises to normal','The change is reversed (negative feedback)'],need:3,model:'The pancreas detects low glucose and releases glucagon, so the liver converts glycogen to glucose and releases it into the blood, raising the level back to normal.',act:'Explain negative feedback'},
{id:'m3-11',m:3,tp:'Diabetes',ao:1,t:'written',mk:2,q:'Describe the difference between the causes of Type 1 and Type 2 diabetes.',ms:['Type 1: the pancreas produces little or no insulin','Type 2: body cells no longer respond (properly) to insulin'],need:2,model:'Type 1: the pancreas does not make enough insulin. Type 2: body cells stop responding to insulin.'},
{id:'m3-12',m:3,tp:'Evaluating evidence',ao:3,t:'mcq',q:'Study 1: 20 people with Type 2 diabetes followed a diet and exercise plan for 3 months. Study 2: 500 people did the same. Both found blood glucose fell. Which statement is the best evaluation?',o:['Study 2 is more reliable because the larger sample reduces the effect of chance','Study 1 is more reliable because small samples are easier to control','The studies are equally reliable because both found a fall','Neither study can show anything about blood glucose'],a:0,e:'A larger sample is more representative and reduces the effect of random variation.'},
/* ---------- MODULE 4 ---------- */
{id:'m4-01',m:4,tp:'Reproductive hormones',ao:1,t:'match',q:'Match each hormone to its function in the menstrual cycle.',p:[['FSH','Causes an egg to mature in the ovary'],['LH','Stimulates release of the egg'],['Oestrogen','Causes the uterus lining to thicken'],['Progesterone','Maintains the uterus lining']],e:'FSH and LH come from the pituitary; oestrogen and progesterone come from the ovaries.',act:'Match hormones to functions'},
{id:'m4-02',m:4,tp:'Hormone graphs',ao:2,t:'num',mk:1,q:'On which day of the cycle does the LH level peak?',ctx:{chart:CH_CYC},a:14,tol:0,u:'day',e:'The LH surge peaks on day 14, which is when ovulation occurs.',act:'Interpret menstrual graph'},
{id:'m4-03',m:4,tp:'Hormone graphs',ao:3,ht:1,t:'mcq',q:'Which observation from the graph best supports the idea that high oestrogen triggers the LH surge?',ctx:{chart:CH_CYC},o:['Oestrogen peaks on day 13, just before LH peaks on day 14','Progesterone is highest around day 21','FSH is highest on day 1','LH is low throughout the cycle'],a:0,e:'The oestrogen peak occurs immediately before the LH peak, consistent with oestrogen stimulating the LH surge.',mis:'Correlation in timing is supporting evidence, not proof of cause.',act:'Interpret menstrual graph'},
{id:'m4-04',m:4,tp:'Cycle sequence',ao:1,ht:1,t:'order',mk:3,q:'Order the hormone events in the first half of the menstrual cycle.',it:['FSH is released by the pituitary gland','An egg matures and the ovary releases oestrogen','High oestrogen stimulates the pituitary to release a surge of LH','LH stimulates the release of the egg (ovulation)','The ovary releases progesterone to maintain the uterus lining'],e:'FSH → egg matures and oestrogen released → oestrogen stimulates the LH surge → ovulation → progesterone maintains the lining.'},
{id:'m4-05',m:4,tp:'Reproductive hormones',ao:2,t:'mcq',q:'A woman’s uterus lining is not maintained after ovulation and her cycle is shortened. Which hormone level is most likely too low?',o:['Progesterone','FSH','LH','Testosterone'],a:0,e:'Progesterone maintains the lining of the uterus.'},
{id:'m4-06',m:4,tp:'Contraception',ao:1,t:'match',q:'Match each contraceptive method to how it works.',p:[['Combined pill','Oestrogen inhibits FSH so eggs do not mature'],['Condom','Stops sperm reaching the egg and protects against STIs'],['Contraceptive implant','Slowly releases progesterone for years'],['Intrauterine device (IUD)','Prevents implantation of an embryo'],['Spermicide','Kills or disables sperm']],e:'Methods may be hormonal, barrier, chemical or devices.',act:'Compare contraceptive methods'},
{id:'m4-07',m:4,tp:'Contraception',ao:2,t:'mcq',q:'A couple want a contraceptive that also reduces the risk of sexually transmitted infections. Which is most suitable?',o:['Condom','Combined pill','Contraceptive implant','Hormonal injection'],a:0,e:'Only barrier methods such as condoms reduce the spread of STIs.',act:'Compare contraceptive methods'},
{id:'m4-08',m:4,tp:'Contraception',ao:3,t:'mcq',q:'The contraceptive pill is over 99% effective with perfect use, but less effective in typical use. Which is the best explanation?',o:['Some users forget to take pills or take them late','The pill stops working after a year','The pill only works for half the cycle','The hormones in the pill change each month'],a:0,e:'Effectiveness depends on correct use. Forgetting pills reduces typical-use effectiveness.',act:'Compare contraceptive methods'},
{id:'m4-09',m:4,tp:'IVF',ao:1,ht:1,t:'written',mk:3,q:'Describe the main stages of IVF.',ms:['FSH and LH are given to stimulate eggs to mature','Eggs are collected from the mother','Eggs are fertilised by sperm in the laboratory','Fertilised eggs develop into embryos','One or two embryos are inserted into the uterus'],need:3,model:'The mother is given FSH and LH, eggs are collected and fertilised in the lab, they grow into embryos, and one or two are inserted into the uterus.'},
{id:'m4-10',m:4,tp:'Fertility treatment',ao:3,ht:1,t:'written',mk:4,q:'A couple have tried to conceive for three years. The woman rarely ovulates. A doctor offers FSH and LH treatment and then IVF. Evaluate this treatment for the couple.',ms:['FSH and LH can stimulate egg maturation and ovulation','IVF gives a chance of pregnancy when natural conception has failed','Success is not guaranteed (success rates are not high)','Treatment can be physically and emotionally stressful','There is a risk of multiple births (health risks to mother and babies)','It can be expensive','Ethical issues, e.g. unused embryos','A reasoned conclusion'],need:4,model:'The hormones may allow ovulation and IVF may give the couple a child, but it may not work, is stressful and costly and may cause multiple births.',act:'Evaluate fertility treatment'},
{id:'m4-11',m:4,tp:'Contraceptive pill',ao:2,ht:1,t:'mcq',q:'The combined pill contains oestrogen and progesterone. Why does it stop eggs maturing?',o:['Oestrogen inhibits FSH, so eggs do not mature','Progesterone stimulates FSH','Both hormones stimulate LH','The pill stops sperm reaching the egg'],a:0,e:'Oestrogen inhibits the release of FSH. Without FSH, eggs do not mature in the ovary.'},
{id:'m4-12',m:4,tp:'Ethics of IVF',ao:3,ht:1,t:'mcq',q:'Which is an ethical issue (rather than a practical or scientific issue) linked to IVF?',o:['Unused embryos may be destroyed','Success rates are not high','Hormone injections are needed','Embryos are inserted into the uterus'],a:0,e:'Ethical issues involve beliefs about right and wrong, such as the status of embryos.'},
/* ---------- MODULE 5 ---------- */
{id:'m5-01',m:5,tp:'Temperature control',ao:1,t:'order',mk:3,q:'Order the events when a person’s body temperature rises too high.',it:['Thermoregulatory centre detects that blood temperature is too high','Impulses are sent to effectors (sweat glands and skin blood vessels)','Sweat evaporates and more blood flows near the skin surface','Heat is lost from the body','Body temperature returns to about 37 °C'],e:'This is a negative feedback loop: detect, signal, respond, return to normal.',act:'Temperature response sequence'},
{id:'m5-02',m:5,tp:'Temperature responses',ao:1,t:'match',q:'Match each response to its effect.',p:[['Sweating','Evaporation transfers energy from the skin to the environment'],['Vasodilation','More blood flows near the skin surface'],['Vasoconstriction','Less blood flows near the skin surface'],['Shivering','Muscle contractions release energy by respiration']],e:'Sweating and vasodilation cool; vasoconstriction and shivering warm or conserve heat.'},
{id:'m5-03',m:5,tp:'Skin diagrams',ao:2,t:'mcq',q:'The diagrams show blood vessels in the skin of a person in two different conditions. Which diagram shows a person who is too hot, and why?',ctx:{svgs:[['A','skin',{state:'dilated'}],['B','skin',{state:'constricted'}]]},o:['A: vasodilation, so more blood near the surface increases heat loss','A: vasoconstriction, so less blood near the surface increases heat loss','B: vasodilation, so more blood near the surface increases heat loss','B: vasoconstriction, so more blood near the surface increases heat loss'],a:0,e:'In diagram A the vessel is wide (vasodilation). More blood near the surface means more energy is radiated to the environment.',act:'Identify responses from diagrams'},
{id:'m5-04',m:5,tp:'Predict responses',ao:2,t:'match',q:'Predict the body’s responses in each situation.',p:[['Waiting at a bus stop at –3 °C in strong wind','Vasoconstriction and shivering'],['Running 10 km on a hot day','Sweating and vasodilation'],['Sitting in a sauna','Sweating and vasodilation']],x:['Release of insulin'],e:'Cold: conserve and generate energy. Heat: increase energy loss.',act:'Predict body responses'},
{id:'m5-05',m:5,tp:'Temperature control',ao:1,t:'mcq',q:'What is the approximate optimum human core body temperature?',o:['37 °C','30 °C','40 °C','25 °C'],a:0,e:'About 37 °C is the optimum for enzymes in the body.'},
{id:'m5-06',m:5,tp:'Temperature data',ao:2,t:'num',mk:1,q:'Calculate the increase in sweat rate when air temperature rises from 20 °C to 40 °C.',ctx:{tbl:TB_AIR},a:55,tol:0,u:'cm³/hour',e:'60 − 5 = 55 cm³ per hour.',act:'Interpret temperature data'},
{id:'m5-07',m:5,tp:'Temperature data',ao:3,t:'mcq',q:'What can be concluded from the data?',ctx:{tbl:TB_AIR},o:['Sweat rate rises steeply at high air temperature but core temperature rises only slightly, so temperature is being regulated','Core temperature falls as air temperature rises','Sweating stops above 30 °C','Sweat rate is directly proportional to air temperature'],a:0,e:'Between 10 and 40 °C air temperature core temperature changes by only 0.4 °C because the body increases sweating.',act:'Interpret temperature data'},
{id:'m5-08',m:5,tp:'Vasodilation',ao:2,t:'mcq',q:'Which statement correctly describes vasodilation?',o:['Blood vessels supplying the skin widen so more blood flows near the surface','Blood vessels move closer to the skin surface','Sweat glands move towards the skin','Blood vessels grow new branches'],a:0,e:'Vessels widen; they do not move.',mis:'Blood vessels do not move towards the skin. They change width.'},
{id:'m5-09',m:5,tp:'Cold response',ao:2,t:'written',mk:3,q:'A person standing outside in cold weather has pale skin and starts to shiver. Explain these two observations.',ms:['Skin looks pale because of vasoconstriction (blood vessels narrow)','Less blood flows near the skin surface so less heat is lost','Shivering is rapid muscle contraction','Respiration in the muscles releases energy that warms the body','Detected by the thermoregulatory centre / skin receptors'],need:3,model:'Vasoconstriction reduces blood flow to the skin (pale) and reduces heat loss. Shivering contracts muscles, and respiration releases energy to warm the body.'},
{id:'m5-10',m:5,tp:'Thyroxine feedback',ao:1,ht:1,t:'order',mk:3,q:'Order the events in negative feedback control of thyroxine when the level is too low.',it:['Thyroxine level falls below normal','The fall is detected and the thyroid gland is stimulated','The thyroid releases more thyroxine','Thyroxine level rises','Level returns to normal and stimulation of the thyroid is reduced'],e:'Negative feedback reverses the change.',act:'Thyroxine feedback sequencing'},
{id:'m5-11',m:5,tp:'Adrenaline',ao:2,ht:1,t:'mcq',q:'A person hears a loud bang and feels frightened. Which set of changes is caused by adrenaline?',o:['Heart rate increases and more oxygen and glucose are delivered to muscles','Heart rate decreases and glucose is stored as glycogen','Body temperature falls and shivering starts','Insulin release increases so glucose moves into cells'],a:0,e:'Adrenaline prepares the body for fight or flight.'},
{id:'m5-12',m:5,tp:'Thyroxine',ao:2,ht:1,t:'mcq',q:'A person’s thyroid gland produces too little thyroxine. Predict the effect on their basal metabolic rate.',o:['It decreases','It increases','It stays the same','It increases then stops'],a:0,e:'Thyroxine stimulates the basal metabolic rate, so less thyroxine means a lower rate.'},
{id:'m5-13',m:5,tp:'Models',ao:3,t:'mcq',q:'A student wraps wet cotton wool around one thermometer and dry cotton wool around another. The wet one cools more. What is a limitation of this as a model of sweating?',o:['It cannot show vasodilation or the body’s feedback control','It shows no cooling effect','Thermometers measure humidity','It proves sweating is the only way to cool'],a:0,e:'A thermometer cannot show vasodilation or regulate itself.'},
/* ---------- MODULE 6 ---------- */
{id:'m6-01',m:6,tp:'Kidney function',ao:1,t:'order',mk:3,q:'Order the main stages of urine production.',it:['Blood is filtered under pressure in the kidney','Small molecules pass out of the blood','All glucose and the water and ions the body needs are reabsorbed','Urea and excess water and ions form urine','Urine is stored in the bladder'],e:'Filtration is non-selective; reabsorption is selective.',act:'Kidney sequence'},
{id:'m6-02',m:6,tp:'ADH and urine',ao:2,t:'match',q:'Match each condition to its result.',p:[['After drinking a large volume of water','Large volume of dilute urine'],['Sweating heavily without drinking','Small volume of concentrated urine'],['Blood water level too low','More ADH released'],['Blood water level too high','Less ADH released']],e:'Low water in the blood: more ADH, more water reabsorbed, concentrated urine.',act:'Match conditions to urine'},
{id:'m6-03',m:6,tp:'Substances in urine',ao:2,t:'mcq',q:'Which substance is in the blood and filtrate but not in the urine of a healthy person?',ctx:{tbl:{h:['Substance','Blood plasma','Filtrate','Urine'],r:[['Water','Yes','Yes','Yes'],['Glucose','Yes','Yes','No'],['Protein','Yes','No','No'],['Urea','Yes','Yes','Yes (more concentrated)']]}},o:['Glucose','Protein','Urea','Water'],a:0,e:'Glucose is filtered but all of it is selectively reabsorbed. Protein is not filtered.',mis:'Protein is not in the filtrate, so it cannot be reabsorbed.',act:'Identify substances in urine'},
{id:'m6-04',m:6,tp:'Substances in urine',ao:2,t:'mcq',q:'A urine test finds protein. Which is the most likely explanation?',o:['Filtration is damaged so large molecules enter the filtrate','Too much ADH is being released','Water reabsorption is too fast','The liver is making too much urea'],a:0,e:'Proteins are large and are not normally filtered out of the blood.'},
{id:'m6-05',m:6,tp:'Urea',ao:1,t:'mcq',q:'Which organ makes urea from excess amino acids?',o:['Liver','Kidney','Pancreas','Bladder'],a:0,e:'Urea is made in the liver and removed by the kidneys.'},
{id:'m6-06',m:6,tp:'ADH',ao:1,ht:1,t:'mcq',q:'How does ADH change the kidney tubules?',o:['It makes the walls more permeable to water','It makes the walls less permeable to water','It makes the tubules longer','It makes them filter proteins'],a:0,e:'More permeable walls mean more water is reabsorbed into the blood.'},
{id:'m6-07',m:6,tp:'Water balance',ao:2,t:'num',mk:2,q:'Assume that on the hot day water gained equals water lost. Calculate the volume of urine produced on the hot day.',ctx:{tbl:TB_WATER},a:.8,tol:.01,u:'dm³',e:'Gained = 2.0 + 0.9 = 2.9. Lost without urine = 1.6 + 0.4 + 0.1 = 2.1. Urine = 2.9 − 2.1 = 0.8 dm³.',act:'Interpret water-balance data'},
{id:'m6-08',m:6,tp:'Water balance',ao:3,t:'mcq',q:'Use the table to explain why less urine is produced on the hot day.',ctx:{tbl:TB_WATER},o:['More water is lost in sweat, so the blood is more concentrated and more ADH is released, increasing water reabsorption','Less ADH is released so more water is reabsorbed','The kidneys filter less urea on a hot day','Less water is drunk on the hot day'],a:0,e:'Sweat loss is 1.5 dm³ higher on the hot day, so the body conserves water.',act:'Interpret water-balance data'},
{id:'m6-09',m:6,tp:'Dialysis v transplant',ao:2,t:'match',q:'Match each statement to dialysis or a kidney transplant.',p:[['Patient must take immunosuppressant drugs','Kidney transplant'],['Takes several hours about three times a week','Dialysis'],['Risk of rejection by the immune system','Kidney transplant'],['Urea diffuses out through a partially permeable membrane','Dialysis'],['Limited by availability of donors and tissue matching','Kidney transplant']],e:'Dialysis replaces filtering; a transplant replaces the failed organ.',act:'Compare dialysis and transplantation'},
{id:'m6-10',m:6,tp:'ADH feedback',ao:2,ht:1,t:'written',mk:4,q:'A person exercises in hot weather without drinking. Explain how ADH helps restore their water level.',ms:['Sweating reduces water in the blood (blood becomes more concentrated)','This is detected and the pituitary gland releases more ADH','ADH makes the kidney tubule walls more permeable to water','More water is reabsorbed into the blood','Small volume of concentrated urine','Water level rises back to normal (negative feedback)'],need:4,model:'Water is lost in sweat; the pituitary releases more ADH; the tubules become more permeable; more water is reabsorbed; a small volume of concentrated urine is made and the water level returns to normal.',act:'ADH explanation'},
{id:'m6-11',m:6,tp:'Treatment evaluation',ao:3,t:'written',mk:4,q:'A 40-year-old has kidney failure. Evaluate dialysis and a kidney transplant as treatments.',ms:['Dialysis is available immediately and needs no major surgery','Dialysis takes hours, several times a week, and restricts lifestyle','A transplant gives a more normal life without regular sessions','A transplant needs a tissue-matched donor and there may be a long wait','Immunosuppressant drugs raise infection risk; risk of rejection','A reasoned judgement or recommendation'],need:4,model:'Dialysis works straight away but is time-consuming and restrictive; a transplant gives a better quality of life but needs a donor, drugs and risks rejection. Dialysis may be used while waiting for a transplant.',act:'Evaluate kidney treatments'},

{id:'m7-02',m:7,tp:'Tropisms',ao:1,t:'match',q:'Match each plant part and stimulus to the growth response.',p:[['Shoot and light','Grows towards the light'],['Shoot and gravity','Grows away from gravity'],['Root and gravity','Grows towards gravity']],x:['Grows away from the light'],e:'Shoots: positive phototropism and negative gravitropism. Roots: positive gravitropism.',act:'Predict shoot and root growth'},

{id:'m7-04',m:7,tp:'Auxin distribution',ao:2,ht:1,t:'mcq',q:'A shoot is lit from the right. Where is auxin concentration highest, and what is the effect?',ctx:{seedling:{light:'right',rot:0,days:0}},o:['The left (shaded) side; cells elongate faster there so the shoot bends right','The right (lit) side; cells elongate faster there so the shoot bends right','The left side; growth is inhibited so the shoot bends left','Equal on both sides; no bending'],a:0,e:'Auxin accumulates on the shaded side and stimulates elongation there, so the shoot bends towards light.',mis:'The side with more auxin grows faster in a shoot.',act:'Predict auxin distribution'},

function diagSVG(key,opt={}){const D=DIAG[key];const pts=opt.pt||Object.keys(D.mk);
 let m='';pts.forEach(k=>{const [x,y]=D.mk[k];m+=`<g class="mk" data-k="${k}" tabindex="0" role="button" aria-label="Marker ${k}"><circle cx="${x}" cy="${y}" r="13"/><text x="${x}" y="${y}">${k}</text></g>`});
 return `<svg viewBox="${D.vb}" role="img" aria-label="${D.alt}">${D.svg}${m}</svg>`}
/* skin diagram */
function skinSVG(o){const w=o.w||(o.state==='dilated'?18:5),n=o.n||(o.state==='dilated'?4:1);let ar='';for(let i=0;i<n;i++)ar+=`<path d="M${70+i*55},40 l0,-26 m-6,8 l6,-8 l6,8" stroke="var(--amber)" stroke-width="2.5" fill="none"/>`;
 return `<svg viewBox="0 0 300 200" role="img" aria-label="Skin section with a blood vessel that is ${o.state}"><rect x="0" y="40" width="300" height="24" fill="#f1c7a6"/><rect x="0" y="64" width="300" height="136" fill="#e3a07f"/>${ar}<text x="8" y="56" font-size="11" fill="#333">skin surface</text><path d="M90,196 L90,92 Q90,76 150,76 Q210,76 210,92 L210,196" fill="none" stroke="#b3202a" stroke-width="${w}" stroke-linecap="round"/><circle cx="256" cy="160" r="12" fill="#c9825f" stroke="#7a4430"/><path d="M256,148 Q250,100 258,64" stroke="#7a4430" stroke-width="3" fill="none"/></svg>`}
/* seedling model (RP8 / simulation D) */
function angDiff(a,b){let d=((b-a)%360+540)%360-180;return d}
function seedlingModel(o){const light=o.light||'none',rot=o.rot||0,days=o.days||0,cl=!!o.clino;
 const lt={left:270,right:90,above:0}[light];let st=0;
 if(lt!==undefined){const wl=cl?1:.65,wg=cl?0:.35;st=Math.atan2(wl*Math.sin(lt*Math.PI/180),wg+wl*Math.cos(lt*Math.PI/180))*180/Math.PI}else if(cl)st=rot;
 const s0=rot,r0=rot+180,rt=cl?r0:180,p=1-Math.exp(-days/2.2);
 const sd=angDiff(s0,st),rd=angDiff(r0,rt);
 return {st,rt,s0,r0,sd,rd,p,sEnd:s0+sd*p,rEnd:r0+rd*p}}
function seedlingSVG(o){const M=seedlingModel(o),days=o.days||0,light=o.light||'none',rot=o.rot||0,cx=200,cy=150;
 const hv=a=>[Math.sin(a*Math.PI/180),-Math.cos(a*Math.PI/180)];
 function stem(a0,a1,L1,L2,col,w,aux,side){let x=cx,y=cy,pts=[[x,y]];const h0=hv(a0);x+=h0[0]*L1;y+=h0[1]*L1;pts.push([x,y]);const N=24,L=L2/N;let dots='';
  for(let i=1;i<=N;i++){const a=a0+(a1-a0)*(i/N),h=hv(a);x+=h[0]*L;y+=h[1]*L;pts.push([x,y]);
   if(aux&&i%3===0){const rt=[Math.cos(a*Math.PI/180),Math.sin(a*Math.PI/180)];const big=aux.big,sm=aux.small;
    const sgn=aux.side;const px=x+rt[0]*7*sgn,py=y+rt[1]*7*sgn,qx=x-rt[0]*7*sgn,qy=y-rt[1]*7*sgn;
    for(let k=0;k<big;k++)dots+=`<circle cx="${(px+rt[0]*sgn*k*2.2).toFixed(1)}" cy="${(py+rt[1]*sgn*k*2.2).toFixed(1)}" r="2.2" fill="var(--amber)"/>`;
    for(let k=0;k<sm;k++)dots+=`<circle cx="${(qx).toFixed(1)}" cy="${(qy).toFixed(1)}" r="2.2" fill="var(--amber)" opacity=".7"/>`}}
  return `<path d="M${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>${dots}`}
 const L2=10+days*12;let sAux=null,rAux=null;
 if(o.aux&&days>0){const asym=Math.abs(M.sd)>3&&M.p>.05;
  sAux={big:asym?3:1,small:asym?0:1,side:M.sd>0?-1:1};   /* shoot: outer side (away from bend) has more auxin */
  rAux={big:asym?3:1,small:asym?0:1,side:M.rd>0?1:-1}}   /* root: inner side (towards bend) has more auxin */
 let arrows='';
 const ar=(x,y,ang)=>{const h=hv(ang),L=34;const ex=x+h[0]*L,ey=y+h[1]*L;const p1=hv(ang+150),p2=hv(ang-150);return `<path d="M${x},${y} L${ex},${ey} M${ex},${ey} l${p1[0]*9},${p1[1]*9} M${ex},${ey} l${p2[0]*9},${p2[1]*9}" stroke="var(--amber)" stroke-width="3" fill="none" stroke-linecap="round"/>`};
 if(light==='left')for(const y of [90,150,210])arrows+=ar(14,y,90);
 if(light==='right')for(const y of [90,150,210])arrows+=ar(386,y,270);
 if(light==='above')for(const x of [120,200,280])arrows+=ar(x,12,180);
 if(light==='all')for(const y of [90,150,210]){arrows+=ar(14,y,90)+ar(386,y,270)}
